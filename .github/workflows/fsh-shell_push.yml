name: fsm-shell push
run-name: '[ON_PUSH fsm-shell] ${{ github.sha }}'

on:
  push:
    branches: [master]

permissions:
  id-token: write # Required for OIDC
  contents: read # Required to clone the repository

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm i
      - name: Unit tests
        run: npm run test:ci:headless

  publish:
    runs-on: ubuntu-latest
    needs:
      - test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install dependencies
        run: npm i
      - name: Run build
        run: npm run build
      - name: Publish
        run: npm publish
